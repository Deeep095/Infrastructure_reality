[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reality"
version = "0.1.0"
description = "Read-only cloud infrastructure discovery and local blast-radius simulation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.34",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
reality = "reality.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reality"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/reality"]
