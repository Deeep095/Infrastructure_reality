services:
  localstack:
    image: localstack/localstack:4.3.0
    container_name: reality-localstack
    ports:
      - "4566:4566"
    environment:
      AWS_DEFAULT_REGION: eu-west-1
      LOCALSTACK_AUTH_TOKEN: "${LOCALSTACK_AUTH_TOKEN:-}"
      SERVICES: sts,ec2,rds,s3,iam,lambda
      DEBUG: "0"
      PERSISTENCE: "0"
      LS_LOG: warning
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"